<!DOCTYPE html>
<html>
<head>
    <title>Aurilla Character</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='fantasy-theme.css') }}">
</head>
<body>
    <main class="container">
        <h1>Create a Character</h1>

        <!-- Shown when create_a_character() rejects the submitted stats -->
        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <!-- POSTs to create_a_character(), which validates the 8-18 range and
             the 20-point budget server-side too (this form only checks client-side) -->
        <form method="POST" action="/create_a_character">

            <label for="character_name">Character Name</label>
            <input type="text" name="character_name" id="character_name">

            <!-- Each stat starts at 8 (the point-buy floor) and can go up to 18.
                 oninput="checkPoints()" recalculates the running point total live. -->
            <label for="strength">Strength (8-18)</label>
            <input type="number" name="strength" id="strength" min="8" max="18" value="8" oninput="checkPoints()">

            <label for="dexterity">Dexterity (8-18)</label>
            <input type="number" name="dexterity" id="dexterity" min="8" max="18" value="8" oninput="checkPoints()">

            <label for="constitution">Constitution (8-18)</label>
            <input type="number" name="constitution" id="constitution" min="8" max="18" value="8" oninput="checkPoints()">

            <label for="intelligence">Intelligence (8-18)</label>
            <input type="number" name="intelligence" id="intelligence" min="8" max="18" value="8" oninput="checkPoints()">

            <label for="wisdom">Wisdom (8-18)</label>
            <input type="number" name="wisdom" id="wisdom" min="8" max="18" value="8" oninput="checkPoints()">

            <label for="charisma">Charisma (8-18)</label>
            <input type="number" name="charisma" id="charisma" min="8" max="18" value="8" oninput="checkPoints()">

            <p>Points remaining: <span id="points_remaining">20</span></p>

            <button type="submit">Create</button>
        </form>
    </main>
</body>

<script>
    // Recalculates "points remaining" out of the 20-point budget every time
    // a stat input changes. Doesn't block submission on its own - the
    // server (create_a_character()) re-validates the totals independently.
    function checkPoints() {
        const stats = ["strength", "dexterity", "constitution", "intelligence", "wisdom", "charisma"];
        let totalSpent = 0;

        stats.forEach(function(stat) {
            const value = parseInt(document.getElementById(stat).value);
            totalSpent += (value - 8);
        });

        document.getElementById("points_remaining").textContent = 20 - totalSpent;

    }
</script>

</html>
